<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Libreta Docente Oficial - Bolivia 2026</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: radial-gradient(circle at center, #3b82f6 0%, #1e3a8a 60%, #0f172a 100%); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* Contenedor de inicio basado estrictamente en la proporción 9 * 16 llenando el cuadro */
        #portadaAcceso { width: 100%; max-width: 360px; aspect-ratio: 9 / 16; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin: auto; padding: 10px; }
        
        /* Imagen redonda que llena por completo el cuadro de 9*16 */
        .portada-img-grande { width: 100%; max-width: 220px; aspect-ratio: 1/1; border-radius: 50%; object-fit: cover; border: 5px solid #38bdf8; box-shadow: 0 0 50px rgba(56, 189, 248, 0.8), 0 0 100px rgba(37, 99, 235, 0.5); cursor: pointer; transition: all 0.4s ease; display: block; margin: 0 auto 15px auto; }
        
        /* Al minimizarse se reduce elegantemente arriba */
        .portada-img-grande.minimazada { width: 85px; height: 85px; border-width: 3px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.8); margin-bottom: 8px; }
        
        /* Formulario deslizable de lado a lado para llenar datos con comodidad móvil */
        .auth-box { width: 100%; max-width: 100%; background: rgba(15, 23, 42, 0.95); border-radius: 20px; padding: 0; border: 2px solid #38bdf8; max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease; backdrop-filter: blur(16px); text-align: left; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .auth-box.activo { max-height: 500px; opacity: 1; padding: 16px; margin-top: 5px; }

        .auth-box label { font-size: 12px; font-weight: 700; color: #38bdf8; text-transform: uppercase; display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
        .auth-box input { width: 100%; padding: 12px; border: 2px solid #2563eb; border-radius: 12px; font-size: 16px; margin-bottom: 10px; background: #0f172a; color: white; text-align: center; }
        .auth-box input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 15px rgba(56, 189, 248, 0.7); }
        
        .btn-accion { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border: none; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6); margin-top: 2px; letter-spacing: 1px; }

        .container { max-width: 100%; width: 100%; margin: auto; background: #ffffff; padding: 14px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); color: #1e293b; display: none; }
        .container.visible { display: block; }

        .header-brand { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 14px; text-align: center; position: relative; }
        
        .avatar-central-panel { 
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: none; 
            outline: 3px solid #3b82f6; outline-offset: 3px; cursor: pointer; background: #e2e8f0; 
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5); 
            margin-bottom: 10px; transition: all 0.3s ease; 
        }
        .avatar-central-panel:active { transform: scale(0.96); }

        .brand-info h1 { color: #1e3a8a; font-size: 17px; margin: 0; font-weight: 800; text-transform: uppercase; }
        .brand-info span { font-size: 12px; color: #64748b; font-weight: 600; display: block; margin-top: 3px; }
        
        .btn-bloquear { position: absolute; top: 0; right: 0; background: #fee2e2; color: #991b1b; border: 1px solid #f87171; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }

        .stats-bar { display: flex; justify-content: space-around; background: #f1f5f9; padding: 8px; border-radius: 8px; margin-bottom: 10px; font-size: 10px; font-weight: bold; text-align: center; color: #334155; border: 1px solid #cbd5e1; }
        .stats-bar span span { display: block; font-size: 13px; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .config-item { display: flex; flex-direction: column; gap: 2px; }
        .config-item.full { grid-column: span 2; }
        .config-item label { font-size: 9px; font-weight: 700; color: #475569; text-transform: uppercase; }
        .config-item input, .config-item select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: white; }

        .section-title { font-size: 11px; font-weight: 700; color: #1e3a8a; margin: 14px 0 6px 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; text-transform: uppercase; }
        
        .table-container { overflow-x: auto; margin-bottom: 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 780px; }
        th, td { border: 1px solid #cbd5e1; padding: 6px 4px; text-align: center; vertical-align: middle; }
        th { background-color: #1e3a8a; color: white; font-size: 10px; font-weight: 600; }
        
        td input { width: 100%; border: 1px solid #e2e8f0; text-align: center; font-size: 13px; background: #fff; padding: 8px 4px; border-radius: 6px; }
        td input:focus { border-color: #1e3a8a; background: #f8fafc; outline: none; }
        .nombre-input { text-align: left !important; width: 140px; font-weight: 500; }
        
        .final-val { font-weight: 700; font-size: 13px; }
        .zona-verde { background: #dcfce7 !important; color: #166534; }
        .zona-amarilla { background: #fef9c3 !important; color: #854d0e; }
        .zona-roja { background: #fee2e2 !important; color: #991b1b; }

        .btn-historial { background: #e0e7ff; color: #3730a3; border: none; padding: 6px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; }

        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
        .btn { padding: 12px; font-size: 11px; border: none; border-radius: 8px; font-weight: 700; text-transform: uppercase; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .btn-add { background: #10b981; color: white; }
        .btn-save { background: #d97706; color: white; }
        .btn-excel { background: #0d9488; color: white; }
        .btn-pdf { background: #1e3a8a; color: white; grid-column: span 2; }

        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 16px; border-radius: 12px; width: 95%; max-width: 420px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: #1e3a8a; margin-top: 0; font-size: 14px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .modal-section { font-size: 11px; font-weight: bold; color: #1e3a8a; margin-top: 10px; margin-bottom: 4px; text-transform: uppercase; }
        .modal-content textarea { width: 100%; height: 100px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; resize: vertical; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f8fafc; padding: 8px; border-radius: 8px; }
        .modal-field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; }
        .modal-field input { padding: 6px; text-align: center; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
        .btn-sugerir { background: #0d9488; color: white; border: none; padding: 6px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; margin-top: 6px; width: 100%; }
        .btn-close { background: #ef4444; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; margin-top: 12px; cursor: pointer; }
    </style>
</head>
<body>

<input type="file" id="inputGlobalFoto" accept="image/*" style="display:none;" onchange="procesarCambioFotoDirecto(event)">

<div id="portadaAcceso">
    <img id="imgPortadaAvatar" src="https://i.ibb.co/wh1Yp5YM/1000736334.png" alt="Libreta" class="portada-img-grande" onclick="toggleMinimizarYDeslizar()">
    
    <div id="seccionFase1" class="auth-box">
        <label>Nombre Completo:</label>
        <input type="text" id="regNombre" placeholder="Lic. Juan Pérez">
        <label>Correo Electrónico:</label>
        <input type="email" id="regCorreo" placeholder="profesor@correo.com">
        <label>Número de Celular:</label>
        <input type="tel" id="regCelular" placeholder="70000000" inputmode="numeric">
        <button class="btn-accion" onclick="guardarFase1()">Entrar a la Libreta</button>
    </div>
</div>

<div class="container" id="panelPrincipal">
    <div class="header-brand">
        <button class="btn-bloquear" onclick="bloquearSesion()">⬅ Salir</button>
        <img id="avatarCentral" src="https://i.ibb.co/wh1Yp5YM/1000736334.png" class="avatar-central-panel" onclick="verificarYCambiarPerfil()" title="Toca para cambiar foto">
        <div class="brand-info">
            <h1 id="lblProfesorNombre">Docente</h1>
            <span id="lblUnidadEducativa">Unidad Educativa</span>
        </div>
    </div>

    <div class="stats-bar">
        <span>👥 Alumnos: <span id="statTotal">0</span></span>
        <span>🟢 Verde: <span id="statVerde" style="color: #166534;">0</span></span>
        <span>🟡 Amarillo: <span id="statAmarillo" style="color: #854d0e;">0</span></span>
        <span>🔴 Rojo: <span id="statRojo" style="color: #991b1b;">0</span></span>
    </div>

    <div class="config-grid">
        <div class="config-item full">
            <label>Materia / Asignatura:</label>
            <select id="materiaSelect" onchange="cambiarMateria()">
                <option value="Matematicas">Matemáticas</option>
                <option value="Lenguaje">Lenguaje y Comunicación</option>
                <option value="CienciasSociales">Ciencias Sociales</option>
                <option value="CienciasNaturales">Ciencias Naturales</option>
                <option value="Fisica">Física</option>
                <option value="Quimica">Química</option>
                <option value="Biologia">Biología - Geografía</option>
                <option value="ArtesPlasticas">Artes Plásticas y Visuales</option>
                <option value="EducacionMusical">Educación Musical</option>
                <option value="EducacionFisica">Educación Física y Deportes</option>
                <option value="Cosmovisiones">Cosmovisiones, Filosofía y Psicología</option>
                <option value="Tecnologia">Técnica Tecnológica</option>
                <option value="Ingles">Idioma Extranjero (Inglés)</option>
                <option value="Religion">Valores, Espiritualidad y Religiones</option>
            </select>
        </div>
        <div class="config-item full">
            <label>Unidad Educativa:</label>
            <input type="text" id="ue" value="Unidad Educativa">
        </div>
        <div class="config-item">
            <label>Profesor(a):</label>
            <input type="text" id="prof" value="Profesor(a)">
        </div>
        <div class="config-item">
            <label>Curso / Paralelo:</label>
            <input type="text" id="curso" value="Curso">
        </div>
        <div class="config-item full">
            <label>Periodo / Trimestre:</label>
            <input type="text" id="trimestre" value="1er Trimestre">
        </div>
    </div>

    <div class="section-title">📊 Registro Consolidado Oficial 2026</div>
    <div class="table-container">
        <table id="tabla-principal">
            <thead>
                <tr>
                    <th style="width: 4%;">N°</th>
                    <th style="width: 28%;">Apellidos y Nombres</th>
                    <th style="width: 8%;">Ser<br>(10%)</th>
                    <th style="width: 9%;">Saber<br>(35%)</th>
                    <th style="width: 9%;">Hacer<br>(35%)</th>
                    <th style="width: 8%;">Decid.<br>(20%)</th>
                    <th style="width: 9%;">Final<br>(100)</th>
                    <th style="width: 10%;">Historial</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </div>

    <div class="actions-grid">
        <button class="btn btn-add" onclick="agregarAlumno()">+ Alumno</button>
        <button class="btn btn-save" onclick="guardarLocalmente()">💾 Guardar</button>
        <button class="btn btn-excel" onclick="exportarExcelMovil()">📊 Excel</button>
        <button class="btn btn-pdf" onclick="exportarPDFMovil()">🖨 Imprimir / PDF</button>
    </div>
</div>

<div id="modalHistorial" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo">Historial del Alumno</h3>
        <div class="modal-section">📖 Apuntes:</div>
        <textarea id="textoApuntes" placeholder="Observaciones..."></textarea>
        <div class="modal-section">📅 Seguimiento Semanal:</div>
        <div class="modal-grid">
            <div class="modal-field"><label
